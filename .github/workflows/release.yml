name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write # OIDC token for npm trusted publishing and the provenance attestation

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-latest

        steps:
            # the actions are pinned to a commit (a moved tag can't change what runs), since this job can get a token to publish to npm
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
              with:
                  run_install: false

            # without the dependencies cache, so a cache saved by another workflow can't end up in the release
            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  registry-url: "https://registry.npmjs.org"

            # fail right away when the tag doesn't match the version that would be published
            - name: Check that the tag matches the package version
              run: |
                  version="v$(node -p 'require("./package.json").version')"
                  if [ "$GITHUB_REF_NAME" != "$version" ]; then
                      echo "::error::The tag ($GITHUB_REF_NAME) doesn't match the package version ($version)."
                      exit 1
                  fi

            # the latest npm (`npm stage` needs 11.15.0 or newer)
            - name: Update npm
              run: npm install --global npm@12

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm run format:check

            - name: Typecheck
              run: pnpm run typecheck:all

            - name: Lint
              run: pnpm run lint

            - name: Test
              run: pnpm test

            # runs `prepack` (typecheck and build), then uploads to the stage queue,
            # where a maintainer has to approve it (with 2FA) on npmjs.com before it is released
            # `--provenance` makes the job fail instead of silently publishing without it
            - name: Publish
              run: npm stage publish --provenance
